# kind cluster shaped for Ingress (HTTP/HTTPS on localhost).
# See scripts/kind-up.sh and TASKS.md §0.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: db-lab
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP
