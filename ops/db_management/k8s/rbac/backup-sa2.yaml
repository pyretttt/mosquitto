apiVersion: v1
kind: ServiceAccount
metadata:
  name: pg-backup-reader
  namespace: records
  labels:
    app.kubernetes.io/part-of: db-lab
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pg-backup-reader
  namespace: records
rules:
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    resourceNames: ["pg-backups"]   # only this PVC
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pg-backup-reader
  namespace: records
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pg-backup-reader
subjects:
  - kind: ServiceAccount
    name: pg-backup-reader
    namespace: records